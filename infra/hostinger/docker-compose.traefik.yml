# Compose autónomo para Hostinger Docker Manager.
# La primera ejecución crea sólo el servicio bootstrap: Docker Manager permite
# cargar variables únicamente después de crear el proyecto. Tras cargarlas, usar
# COMPOSE_PROFILES=app y PIGAR_IMAGE_TAG (SHA publicado en GHCR) para iniciar el
# stack. No contiene secretos ni construye imágenes en el VPS.
name: pigar-staging

x-app-image: &app-image "ghcr.io/gruposim/pigar-app:${PIGAR_IMAGE_TAG:-bootstrap}"
x-nginx-image: &nginx-image "ghcr.io/gruposim/pigar-nginx:${PIGAR_IMAGE_TAG:-bootstrap}"

x-app-environment: &app-environment
  NODE_ENV: production
  PIGAR_API_BASE_URL: http://api:3000/api

services:
  bootstrap:
    image: alpine:3.21
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    restart: unless-stopped

  nginx:
    image: *nginx-image
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
      customer-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    volumes:
      - pigar-media-data:/var/lib/pigar/media:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - "traefik.http.routers.pigar-staging.rule=Host(`${PIGAR_STAGING_FQDN:-}`)"
      - traefik.http.routers.pigar-staging.entrypoints=websecure
      - traefik.http.routers.pigar-staging.tls.certresolver=letsencrypt
      - traefik.http.services.pigar-staging.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: 0.10
    mem_limit: 128m
    restart: unless-stopped

  customer-web:
    image: *app-image
    profiles: ["app"]
    command: ["pnpm", "--filter", "@pigar/customer-web", "exec", "next", "start", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: *app-environment
      PIGAR_CUSTOMER_AUTH0_APP_BASE_URL: ${PIGAR_CUSTOMER_AUTH0_APP_BASE_URL:-}
      PIGAR_CUSTOMER_AUTH0_AUDIENCE: ${PIGAR_CUSTOMER_AUTH0_AUDIENCE:-}
      PIGAR_CUSTOMER_AUTH0_CLIENT_ID: ${PIGAR_CUSTOMER_AUTH0_CLIENT_ID:-}
      PIGAR_CUSTOMER_AUTH0_CLIENT_SECRET: ${PIGAR_CUSTOMER_AUTH0_CLIENT_SECRET:-}
      PIGAR_CUSTOMER_AUTH0_DOMAIN: ${PIGAR_CUSTOMER_AUTH0_DOMAIN:-}
      PIGAR_CUSTOMER_AUTH0_SESSION_SECRET: ${PIGAR_CUSTOMER_AUTH0_SESSION_SECRET:-}
      PIGAR_CUSTOMER_AUTH0_EMAIL_OTP_CONNECTION: ${PIGAR_CUSTOMER_AUTH0_EMAIL_OTP_CONNECTION:-}
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8
    cpus: 0.20
    mem_limit: 256m
    restart: unless-stopped

  admin-web:
    image: *app-image
    profiles: ["app"]
    command: ["pnpm", "--filter", "@pigar/admin-web", "exec", "next", "start", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: *app-environment
      APP_BASE_URL: ${PIGAR_ADMIN_AUTH0_APP_BASE_URL:-}
      AUTH0_CLIENT_ID: ${PIGAR_ADMIN_AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${PIGAR_ADMIN_AUTH0_CLIENT_SECRET:-}
      AUTH0_DOMAIN: ${PIGAR_ADMIN_AUTH0_DOMAIN:-}
      AUTH0_SECRET: ${PIGAR_ADMIN_AUTH0_SESSION_SECRET:-}
      AUTH0_AUDIENCE: ${PIGAR_ADMIN_AUTH0_AUDIENCE:-}
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/admin').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8
    cpus: 0.20
    mem_limit: 256m
    restart: unless-stopped

  migrate:
    image: *app-image
    profiles: ["app"]
    command: ["pnpm", "--filter", "@pigar/api", "prisma:migrate:deploy"]
    environment:
      <<: *app-environment
      DATABASE_URL: ${PIGAR_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    image: *app-image
    profiles: ["app"]
    command: ["node", "apps/api/dist/index.js"]
    environment:
      <<: *app-environment
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${PIGAR_DATABASE_URL:-}
      MEDIA_ROOT: /var/lib/pigar/media
      AUTH0_ADMIN_CLIENT_ID: ${PIGAR_API_AUTH0_ADMIN_CLIENT_ID:-}
      AUTH0_AUDIENCE: ${PIGAR_API_AUTH0_AUDIENCE:-}
      AUTH0_ISSUER: ${PIGAR_API_AUTH0_ISSUER:-}
      AUTH0_MANAGEMENT_CLIENT_ID: ${PIGAR_API_AUTH0_MANAGEMENT_CLIENT_ID:-}
      AUTH0_MANAGEMENT_CLIENT_SECRET: ${PIGAR_API_AUTH0_MANAGEMENT_CLIENT_SECRET:-}
      AUTH0_INTERNAL_CONNECTION: ${PIGAR_API_AUTH0_INTERNAL_CONNECTION:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      PIGAR_PAYMENT_RETURN_BASE_URL: ${PIGAR_PAYMENT_RETURN_BASE_URL:-}
      MERCADO_PAGO_CHECKOUT_HOSTS: ${MERCADO_PAGO_CHECKOUT_HOSTS:-}
      MERCADO_PAGO_REQUEST_TIMEOUT_MS: ${MERCADO_PAGO_REQUEST_TIMEOUT_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - pigar-media-data:/var/lib/pigar/media
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8
    cpus: 0.35
    mem_limit: 512m
    restart: unless-stopped

  worker:
    image: *app-image
    profiles: ["app"]
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *app-environment
      WORKER_POLL_INTERVAL_MS: 30000
      DATABASE_URL: ${PIGAR_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"try { process.kill(1, 0); process.exit(0) } catch { process.exit(1) }\""]
      interval: 15s
      timeout: 3s
      retries: 5
    cpus: 0.20
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: ["app"]
    environment:
      POSTGRES_DB: ${PIGAR_POSTGRES_DB:-pigar_staging}
      POSTGRES_USER: ${PIGAR_POSTGRES_USER:-pigar_staging}
      POSTGRES_PASSWORD: ${PIGAR_POSTGRES_PASSWORD:-}
    volumes:
      - pigar-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: 0.50
    mem_limit: 768m
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  pigar-postgres-data:
  pigar-media-data:

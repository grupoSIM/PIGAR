services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pigar_test
      POSTGRES_USER: pigar
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "5434:5432"
    volumes:
      - pigar-postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigar -d pigar_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pigar-postgres-test:

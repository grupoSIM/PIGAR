events {}

http {
  server_tokens off;

  upstream customer_web { server customer-web:3000; }
  upstream admin_web { server admin-web:3000; }
  upstream api { server api:3000; }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    # OIDC callbacks can return several Set-Cookie headers when the session is
    # established. The default proxy header buffer is too small for that
    # response and makes Nginx return 502 before the customer portal receives
    # the callback.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /health/live {
      access_log off;
      return 200 "nginx ok\n";
    }

    # The physical media volume is never a public location. A future authorized
    # delivery path may only use Nginx internal redirects from the API.
    location /media/ { return 404; }

    location /internal-media/ {
      internal;
      alias /var/lib/pigar/media/objects/;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
      proxy_pass http://admin_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://customer_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

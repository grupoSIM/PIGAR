events {}

http {
  server_tokens off;

  upstream customer_web { server customer-web:3000; }
  upstream admin_web { server admin-web:3000; }
  upstream api { server api:3000; }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 50m;

    # OIDC callbacks can return several Set-Cookie headers when the session is
    # established. The default proxy header buffer is too small for that
    # response and makes Nginx return 502 before the customer portal receives
    # the callback.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /health/live {
      access_log off;
      return 200 "nginx ok\n";
    }

    # The physical media volume is never a public location. A future authorized
    # delivery path may only use Nginx internal redirects from the API.
    location /media/ { return 404; }

    location /internal-media/ {
      internal;
      alias /var/lib/pigar/media/objects/;
    }

    # NestJS owns only its versioned contract and healthchecks. The application
    # remains private behind Nginx; this also leaves room for future API
    # versions without exposing arbitrary internal endpoints.
    # Mercado Pago firma el valor original de X-Request-ID. Esta ruta no debe
    # reutilizar ni generar el ID de correlación de PIGAR antes de la API.
    location = /api/v1/webhooks/mercado-pago {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
    }

    location ^~ /api/v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/health/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer route handlers deliberately use /api. This catch-all means a
    # new customer endpoint requires no Nginx change; it can proxy internally
    # to NestJS through PIGAR_API_BASE_URL while /api/v1 remains reserved.
    location ^~ /api/ {
      proxy_pass http://customer_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
      proxy_pass http://admin_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://customer_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

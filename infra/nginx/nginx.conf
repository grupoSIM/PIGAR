events {}

http {
  server_tokens off;

  upstream customer_web { server customer-web:3000; }
  upstream admin_web { server admin-web:3000; }
  upstream api { server api:3000; }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /health/live {
      access_log off;
      return 200 "nginx ok\n";
    }

    # The physical media volume is never a public location. A future authorized
    # delivery path may only use Nginx internal redirects from the API.
    location /media/ { return 404; }

    location /internal-media/ {
      internal;
      alias /var/lib/pigar/media/objects/;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
      proxy_pass http://admin_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth0 Organizations delivers invitation parameters to this exact public
    # entrypoint. It is internally served by the backoffice route and never
    # exposes a separate authentication surface.
    location = /login {
      proxy_pass http://admin_web/admin/login;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://customer_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

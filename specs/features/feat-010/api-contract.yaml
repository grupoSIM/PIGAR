openapi: 3.1.0
info:
  title: PIGAR Aftercare Ratings and Incidents API
  version: 1.0.0-draft
  description: >-
    Contrato propuesto de feat-010. La postventa sólo aplica a órdenes CERRADAS,
    no representa garantía y nunca modifica orden, pago, cargo o conformidad.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /v1/requests/{requestId}/rating:
    post:
      summary: Crea la única calificación inmutable del CLIENT propietario
      operationId: createOwnOrderRating
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingRequest"
      responses:
        "201":
          description: Calificación creada; el acuse omite el texto de OTRO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingReceipt"
        "200":
          description: Reintento idempotente idéntico; mismo acuse mínimo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      summary: Consulta explícitamente la calificación de la orden propia
      operationId: getOwnOrderRating
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Detalle propio; incluye otherMessage sólo cuando corresponde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/requests/{requestId}/incidents:
    post:
      summary: Abre una incidencia estructurada sobre la orden propia cerrada
      operationId: createOwnAftercareIncident
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incidencia ABIERTA e historial inicial creados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "200":
          description: Reintento idempotente idéntico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      summary: Lista incidencias únicamente de la orden propia
      operationId: listOwnAftercareIncidents
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página propia con historial estructurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/admin/orders/{orderId}/aftercare:
    get:
      summary: Consulta de soporte de calificación e incidencias de una orden
      operationId: getOrderAftercareForSupport
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Vista ADMIN/DISPATCHER explícita y sin facultad sobre rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AftercareSupportView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/admin/incidents:
    get:
      summary: Bandeja estructurada de incidencias para soporte
      operationId: listAftercareIncidentsForSupport
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IncidentType"
      responses:
        "200":
          description: Página operativa sin texto libre ni datos de pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/admin/incidents/{incidentId}/transitions:
    post:
      summary: Inicia triage o cierra la incidencia con transición estricta
      operationId: transitionAftercareIncident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionIncidentRequest"
      responses:
        "200":
          description: Transición aplicada o reintento idempotente idéntico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco emitido por la página anterior.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    RatingReason:
      type: string
      enum:
        - CALIDAD_DEL_TRABAJO
        - PUNTUALIDAD
        - TRATO_Y_COMUNICACION
        - CLARIDAD_DEL_PROCESO
        - EXPERIENCIA_GENERAL
        - OTRO
    IncidentType:
      type: string
      enum:
        - RESULTADO_NO_ESPERADO
        - PROBLEMA_REAPARECIO
        - TRABAJO_INCOMPLETO
        - DANIO_REPORTADO
        - CONSULTA_SOBRE_COBRO
    IncidentStatus:
      type: string
      enum:
        - ABIERTA
        - EN_TRIAGE
        - CERRADA
    CreateRatingRequest:
      type: object
      additionalProperties: false
      required:
        - stars
        - reason
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        reason:
          $ref: "#/components/schemas/RatingReason"
        otherMessage:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Longitud posterior a NFKC y trim, sólo con OTRO. HTML, URLs,
            controles y adjuntos se rechazan en servidor.
      allOf:
        - if:
            properties:
              reason:
                const: OTRO
            required:
              - reason
          then:
            required:
              - otherMessage
          else:
            not:
              required:
                - otherMessage
    RatingReceipt:
      type: object
      additionalProperties: false
      required:
        - id
        - stars
        - reason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 1
          maximum: 5
        reason:
          $ref: "#/components/schemas/RatingReason"
        createdAt:
          type: string
          format: date-time
    RatingDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - stars
        - reason
        - otherMessage
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 1
          maximum: 5
        reason:
          $ref: "#/components/schemas/RatingReason"
        otherMessage:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: "null"
        createdAt:
          type: string
          format: date-time
    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/IncidentType"
    TransitionIncidentRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - expectedVersion
      properties:
        action:
          type: string
          enum:
            - START_TRIAGE
            - CLOSE
        expectedVersion:
          type: integer
          minimum: 1
    IncidentTransitionView:
      type: object
      additionalProperties: false
      required:
        - sequence
        - action
        - fromStatus
        - toStatus
        - actorRole
        - createdAt
      properties:
        sequence:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - OPEN
            - START_TRIAGE
            - CLOSE
        fromStatus:
          oneOf:
            - $ref: "#/components/schemas/IncidentStatus"
            - type: "null"
        toStatus:
          $ref: "#/components/schemas/IncidentStatus"
        actorRole:
          type: string
          enum:
            - CLIENT
            - ADMIN
            - DISPATCHER
        createdAt:
          type: string
          format: date-time
    IncidentDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - requestId
        - type
        - status
        - version
        - createdAt
        - updatedAt
        - closedAt
        - history
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/IncidentType"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        history:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/IncidentTransitionView"
    IncidentPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/IncidentDetail"
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
    AftercareSupportView:
      type: object
      additionalProperties: false
      required:
        - orderId
        - orderState
        - rating
        - incidents
      properties:
        orderId:
          type: string
          format: uuid
        orderState:
          const: CERRADA
        rating:
          oneOf:
            - $ref: "#/components/schemas/RatingDetail"
            - type: "null"
        incidents:
          $ref: "#/components/schemas/IncidentPage"
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: Entrada, enum, cursor, longitud o contenido inválido; no refleja valores.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Autenticación requerida o inválida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Rol autenticado no autorizado para el endpoint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente o no perteneciente al CLIENT; respuesta uniforme.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Estado, versión, unicidad o idempotencia en conflicto; sin mutación.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: El cuerpo excede el límite configurado.
    UnsupportedMediaType:
      description: Sólo se admite application/json; multipart y adjuntos se rechazan.
    TooManyRequests:
      description: Límite excedido sin mutación.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1

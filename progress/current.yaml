  - review-7 del 2026-09-02 fue FAIL; sus hallazgos se corrigieron y requieren nueva revisión independiente. No habilita publication_review.
  - review-8 del 2026-09-02 fue FAIL por degradación ADMIN; se corrigió con error accesible, conservación de datos y reintento. review-9 emitió PASS independiente y habilitó publication_review.
  - feat-010 cerró discovery el 2026-08-31 por autorización explícita del usuario y se encuentra en publication_review. No autoriza publicación ni despliegue sin la puerta humana correspondiente.
  - Architect Reviewer independiente emitió el 2026-08-31 `approved_with_conditions` para el límite aprobado, incluido el texto libre de hasta 100 caracteres exclusivo de `Otro`. No requiere ADR nueva mientras no se agreguen garantía, cambio de orden, dinero, proveedor/canal o multimedia.
  - La dependencia feat-007 está cerrada en staging; su excepción Webhook continúa bloqueando únicamente producción.
  - feat-006 y feat-011 permanecen fuera del MVP; feat-008 sigue bloqueada por la dependencia propuesta feat-006.

blockers: []

architecture_conditions:
  before_specification_approval:
    - Limitar feat-014 a presentación, navegación y composición frontend; no cambiar reglas, permisos, estados, API, pagos, órdenes, identidad, datos o proveedores.
    - Mantener visibles y operables notificaciones, pagos/conformidad, rating, incidencias y acciones administrativas aunque no tengan referencia Stitch directa.
    - No copiar code.html ni incorporar recursos visuales remotos, datos del prototipo o una dependencia/herramienta no aprobada.
    - Mantener fuera de alcance dashboard/KPIs, tracking, contacto directo con técnico, presupuestos complejos, reportes, pedidos/materiales y portal de operarios.
    - Definir rutas, estrategia de iconos, baselines y tolerancia visual antes de aprobar la especificación.
  before_production:
    - Validar con asesoría legal los plazos de retención y borrado.
    - Elegir y aprobar un destino externo de backup cifrado y probar una restauración completa.
    - Completar hardening del VPS, modelado de amenazas, monitoreo y respuesta a incidentes.
    - Resolver TEST-007-014/AC-007-016 del Webhook automático de Mercado Pago.

risks:
  - Copiar fielmente contenido funcional de Stitch podría reintroducir tracking, contacto, KPIs, recomendaciones o flujos no aprobados.
  - Separar la página monolítica actual puede romper navegación, estado o selectores E2E aunque no cambie el backend.
  - Las funciones posteriores a Stitch pueden quedar visualmente relegadas u ocultas si no se valida su inventario por pantalla.
  - Capturas o diffs visuales podrían exponer PII, adjuntos, tokens o URLs firmadas si no usan fixtures sintéticos y máscaras limitadas.
  - Elegir silenciosamente iconos, snapshots o dependencias de accesibilidad violaría la puerta de arquitectura/especificación.

decisions:
  - id: DEC-014-001
    status: accepted
    note: Separar la página monolítica en vistas/contextos navegables sin modificar endpoints ni ocultar funciones.
  - id: DEC-014-002
    status: accepted
    note: Priorizar iconos locales SVG/CSS; cualquier paquete nuevo requiere licencia, peso, alternativa y aprobación.
  - id: DEC-014-003
    status: accepted
    note: Versionar sólo baselines visuales sintéticos aprobados y seguros.
  - id: DEC-014-004
    status: accepted
    note: Definir tolerancia de comparación después de obtener un baseline estable; no inventar un umbral en discovery.
  - id: DEC-014-005
    status: accepted
    note: Usar Inicio, Mis solicitudes y Perfil como patrón CLIENT sin simular destinos todavía no implementados.


architecture_conditions:
  before_specification_approval:
    - Convertir las PoC de carga multimedia por streaming y webhooks/idempotencia de pagos en tareas con criterios de aceptación.
    - Definir la máquina de estados exacta, permisos administrativos y tratamiento de pagos pendientes o rechazados.
    - Incluir matriz de permisos y pruebas negativas de acceso cruzado a solicitudes y multimedia.
    - Definir capacidad mínima del VPS, límites por contenedor, alertas y presupuesto/cuotas de proveedores externos.
    - Validar Auth0, Google Maps y Mercado Pago con cuentas no productivas, incluyendo MFA, restricciones de claves y cuotas.
    - Documentar el cifrado en reposo aplicable al VPS y mantener ADR-007 sin chat ni mensajería integrada.
  before_production:
    - Validar con asesoría legal los plazos de retención y borrado.
    - Elegir y aprobar un destino externo de backup cifrado y probar una restauración completa.
    - Completar hardening del VPS, modelado de amenazas, monitoreo y respuesta a incidentes.

risks:
  - Aplicación, base de datos y multimedia comparten un único VPS y dominio de falla.
  - El crecimiento de multimedia puede agotar disco, ancho de banda o capacidad del VPS.
  - Pagos, identidad y mapas agregan dependencia de proveedores externos.
  - Multimedia y domicilios requieren límites de acceso, retención y borrado verificables.


project: PIGAR
active_feature: feat-010
phase: publication_review
updated_at: 2026-09-02T16:40:00-03:00

blockers:
  - La garantía permanece expresamente diferida; cualquier promesa comercial, remedio económico u operativo requiere un discovery y aprobación nuevos.
  - Producción continúa bloqueada además por TEST-007-014/AC-007-016 hasta resolver el Webhook automático de Mercado Pago.

architecture_conditions:
  before_specification_approval:
    - Mantener la orden cerrada y su historial como fuente de verdad; una calificación o incidencia no reabre, altera pagos ni crea una nueva orden automáticamente.
    - Mantener la garantía fuera de feat-010; no calcular elegibilidad ni ofrecer una promesa de cobertura.
    - Aplicar los datos, actores, permisos, idempotencia, retención, borrado, logs y pruebas negativas aprobados para calificaciones e incidencias.
    - Mantener texto libre sólo en `Otro` de la calificación, con revisión focalizada aprobada y los límites documentados; multimedia y canales externos siguen excluidos.
  before_production:
    - Validar con asesoría legal los plazos de retención y borrado.
    - Elegir y aprobar un destino externo de backup cifrado y probar una restauración completa.
    - Completar hardening del VPS, modelado de amenazas, monitoreo y respuesta a incidentes.

risks:
  - Una garantía ambigua puede crear una obligación comercial o legal no prevista.
  - Comentarios, incidencias o adjuntos pueden contener datos personales y elevar la exposición, retención y superficie de abuso.
  - Accesos cruzados, duplicados o reaperturas implícitas pueden alterar expectativas de postventa sin modificar el dominio autorizado.
  - Un flujo de incidencia que cree trabajo, pagos o notificaciones sin contrato explícito extendería el MVP fuera del alcance aprobado.

decisions:
  - id: ADR-007
    status: accepted
    note: El MVP aprobado ofrece estado e historial dentro del portal; email, Web Push y WhatsApp siguen diferidos.
  - id: DEC-010-001
    status: accepted
    note: CLIENT propietario puede crear una única calificación inmutable de 1 a 5 estrellas por orden CERRADA, con motivo allowlist y `Otro` obligatorio de 1 a 100 caracteres.
  - id: DEC-010-002
    status: accepted
    note: No se ofrece ni calcula garantía en feat-010; queda diferida como decisión comercial y legal futura.
  - id: DEC-010-003
    status: accepted
    note: CLIENT propietario abre una incidencia estructurada por orden CERRADA; ADMIN/DISPATCHER realizan triage y cierre sin crear, reabrir ni alterar órdenes, pagos o conformidad.
  - id: DEC-010-004
    status: accepted
    note: Incidencias usan tipo estructurado sin texto libre ni multimedia. Sólo `Otro` de la calificación admite mensaje de hasta 100 caracteres, con minimización y retención documentadas.
  - id: DEC-010-005
    status: accepted
    note: La postventa se consulta sólo en el portal; no se agregan avisos in-app, email, Web Push, WhatsApp ni proveedores externos.


project: PIGAR
active_feature: feat-009
phase: done
updated_at: 2026-08-31T00:00:00-03:00

blockers:
  - Todo canal externo requiere revisar ADR-007 y aprobar proveedor, consentimiento, plantillas, costes, soporte y tratamiento de datos; permanece fuera de esta especificación.
  - Producción continúa bloqueada además por TEST-007-014/AC-007-016 hasta resolver el Webhook automático de Mercado Pago.

architecture_conditions:
  before_specification_approval:
    - Mantener el estado de dominio y su historial como única fuente de verdad; una notificación nunca confirma una transición.
    - Definir eventos, destinatarios, contenido allowlist, idempotencia, permisos, retención y recuperación de avisos.
    - Si se incorpora un canal externo, revisar ADR-007 y validar privacidad, consentimiento, bajas, rebotes, costes, cuotas, secretos y soporte.
  before_production:
    - Validar con asesoría legal los plazos de retención y borrado.
    - Elegir y aprobar un destino externo de backup cifrado y probar una restauración completa.
    - Completar hardening del VPS, modelado de amenazas, monitoreo y respuesta a incidentes.

risks:
  - Avisos duplicados, perdidos o demorados pueden generar expectativas incorrectas aunque no alteren el dominio.
  - Contenido o logs de notificaciones pueden filtrar datos de solicitudes, técnicos, pagos o proveedores.
  - Un proveedor externo agrega costes, cuotas, secretos, entregabilidad, consentimiento y dependencia operativa.
  - El historial de avisos y su estado de lectura requieren retención, índices y autorización por propietario.


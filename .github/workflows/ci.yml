name: quality

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @pigar/api prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm test:e2e
      - run: pnpm test:ci-contract
      - run: pnpm docs:check

  publish-staging-images:
    needs: verify
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-staging-images.yml

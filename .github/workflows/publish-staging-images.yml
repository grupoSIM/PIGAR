name: publish-staging-images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-staging-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and publish app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/app.Dockerfile
          push: true
          tags: ghcr.io/gruposim/pigar-app:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/nginx.Dockerfile
          push: true
          tags: ghcr.io/gruposim/pigar-nginx:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
